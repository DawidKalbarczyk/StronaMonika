<body>
<script>
  const usePrettyRoutes = window.location.hostname.endsWith("github.io")
    || window.location.hostname === "obsession-kozienice.pl"
    || window.location.hostname === "www.obsession-kozienice.pl";

  if (usePrettyRoutes) {
    const markerIndex = window.location.pathname.indexOf("/pages/");
    if (markerIndex !== -1) {
      const basePath = window.location.pathname.slice(0, markerIndex);
      const normalizedPath = `${basePath}/pages/zabiegi`;
      if (window.location.pathname !== normalizedPath) {
        window.history.replaceState({}, "", `${normalizedPath}${window.location.search}${window.location.hash}`);
      }
    }
  }

  document.body.classList.add("page-is-loading");
  window.addEventListener("load", () => {
    document.body.classList.remove("page-is-loading");
  }, { once: true });
</script>
