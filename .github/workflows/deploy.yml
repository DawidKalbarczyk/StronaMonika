name: Deploy react app to github pages
on:
  push:
    branches:
      - env-qa

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Sprawdzenie
        uses: actions/checkout@v4

      - name: Przygotuj Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Instaluj zależności Python
        run: pip install pandas openpyxl pytz Pillow
        working-directory: backend

      - name: Konwertuj Excel na JSON + Update Time + Scale Gallery
        run: python convertJson.py
        working-directory: backend

      - name: Instaluj zależności Python - Word
        run: pip install python-docx odfpy
        working-directory: backend

      - name: Konwertuj Word na JSON
        run: python -c "import convertWord; convertWord.czytaj_word()"
        working-directory: backend

      - name: Kompresuj zdjęcia
        run: python -c "import convertWord; convertWord.kompresuj_myphotos()"
        working-directory: backend

      - name: Przygotuj pliki do wrzucenia
        run: |
          mkdir -p _site
          cp -r pages _site/
          cp -r pages-js _site/
          cp -r styles _site/
          cp -r backend _site/
          cp -r modules _site/
          cp index.html _site/
          cp index.js _site/

      - name: Wrzuc artefakty
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Wrzucenie na github pages
        id: deployment
        uses: actions/deploy-pages@v4
